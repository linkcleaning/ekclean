<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf7ef">
  <title>잠깐 쉬어가는 중 · 이케이클린</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles/fonts.css">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#faf7ef;color:#443d33;font-family:'Noto Sans KR',sans-serif;padding:24px}main{max-width:440px;border:1px solid #d5dfc8;background:#fffdf8;padding:30px 24px;border-radius:22px;text-align:center;box-shadow:4px 5px #e1e7d5}img{width:72px;height:72px}h1{font-size:24px;line-height:1.5;margin:16px 0 12px}p{font-size:15px;line-height:1.9;color:#81786b}a{display:inline-flex;min-height:48px;align-items:center;padding:10px 18px;margin-top:15px;border:1px solid #b6c49f;border-radius:10px;background:#e9efdf;color:#536346;text-decoration:none;font-size:14px;font-weight:700}a:focus-visible{outline:3px solid #d77c67;outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <img src="./icons/icon-192.png" alt="이케이클린 비누 로고" width="72" height="72">
    <h1>연결이 잠시 쉬어가고 있어요.</h1>
    <p>저장된 홈 화면과 회사 소개는 계속 볼 수 있어요. 처음 방문한 페이지나 외부 상담 채널은 인터넷 연결 후 다시 이용해 주세요.</p>
    <a href="./">저장된 홈 화면으로</a>
  </main>
  <script defer src="./pwa.js"></script>
</body>
</html>
